# Render blueprint for opsdash.
#
# Two services: the Next.js app and a managed Postgres. Nothing is stored
# on the container's filesystem, so a restart or redeploy loses nothing.
#
# Before the first deploy, read DEPLOY.md — in particular the part about
# SESSION_SECRET and running the migrations, neither of which happens by
# itself.

databases:
  - name: opsdash-db
    plan: basic-256mb
    databaseName: opsdash
    user: opsdash

services:
  - type: web
    name: opsdash
    # Docker, not the native Node runtime, and not by preference.
    #
    # Accounting uploads photos and scans of fuel statements; reading those
    # needs `pdftoppm` (poppler) and `tesseract` on the box. Render's native
    # runtime ships neither, and a native build has no apt — an
    # `apt-get install` in buildCommand would fail at deploy rather than
    # install anything. Render's own docs say to use Docker for any OS-level
    # package, so the tools are installed in the Dockerfile.
    # https://render.com/docs/native-runtimes
    #
    # Paths are relative to the REPO root, not to rootDir; the app lives in
    # opsdash/. There is no buildCommand or startCommand under Docker — the
    # Dockerfile's own build steps and CMD are what run.
    runtime: docker
    plan: starter
    rootDir: opsdash
    dockerfilePath: ./opsdash/Dockerfile
    dockerContext: ./opsdash
    # Public, and touches neither the session nor the database: a health
    # check that needs either reports the app as dead during exactly the
    # incidents where you want it up and telling you what is wrong.
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: opsdash-db
          property: connectionString
      # Generated by Render and never seen by anyone. Sessions survive
      # restarts because it is stable; rotating it signs everybody out,
      # which is the emergency lever.
      - key: SESSION_SECRET
        generateValue: true
