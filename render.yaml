# Render blueprint for DriverQual.
#
# Data lives in a hosted Turso (libSQL) database rather than on local disk, so
# this runs on Render's free tier: nothing is stored on the container's
# filesystem, and a restart or redeploy loses nothing.
#
# Create the database first (see driverqual/DEPLOY.md), then paste its URL and
# auth token into the Render dashboard when prompted.

services:
  - type: web
    name: driverqual
    runtime: node
    plan: free
    rootDir: driverqual
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    # Public, and touches neither the session nor the database, so protecting
    # the app does not make Render think it has died.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Prompted for on first deploy. Never commit these.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # The shared access code. Without it the app runs open to anyone with the
      # URL and shows a warning banner on every screen.
      - key: APP_ACCESS_CODE
        sync: false
      # Optional extra entropy for session signing. Sessions stay valid across
      # restarts only if this is set; leave unset and a restart signs everyone out.
      - key: SESSION_SECRET
        generateValue: true
      # Optional integrations; the app runs without them.
      - key: OPENAI_API_KEY
        sync: false
      - key: FMCSA_API_KEY
        sync: false
