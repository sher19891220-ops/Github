# Render blueprint for this repo.
#
# Render reads ONE render.yaml, and only the one at the REPO ROOT. A
# per-project file like opsdash/render.yaml is never looked at, so every app
# in this repo is defined here or it silently does not deploy.
#
# Each app's own DEPLOY.md still applies: neither the migrations, the
# reference data, nor the accounts happen by themselves.
#
# driverqual - Turso (libSQL) hosted elsewhere, so it needs no database here.
#              Create it first (driverqual/DEPLOY.md), then paste its URL and
#              auth token into the dashboard when prompted. autoDeploy is on.
#
# opsdash    - The ops/accounting ledger, on Docker rather than the native
#              Node runtime: accounting uploads photos of fuel statements and
#              reading those needs poppler and tesseract on the box, which a
#              native build cannot install. See opsdash/Dockerfile.
#              autoDeploy is OFF on purpose — this one posts to a ledger, so
#              a deploy should be a decision, not a consequence of a push.

services:
- type: web
  name: driverqual
  runtime: node
  plan: free
  rootDir: driverqual
  buildCommand: npm ci && npm run build
  startCommand: npm run start
  healthCheckPath: /api/health
  autoDeploy: true
  envVars:
  - key: NODE_VERSION
    value: '22'
  - key: NODE_ENV
    value: production
  - key: TURSO_DATABASE_URL
    sync: false
  - key: TURSO_AUTH_TOKEN
    sync: false
  - key: APP_ACCESS_CODE
    sync: false
  - key: SESSION_SECRET
    generateValue: true
  - key: OPENAI_API_KEY
    sync: false
  - key: FMCSA_API_KEY
    sync: false
- type: web
  name: opsdash
  runtime: docker
  plan: starter
  rootDir: opsdash
  dockerfilePath: ./opsdash/Dockerfile
  dockerContext: ./opsdash
  healthCheckPath: /api/health
  autoDeploy: false
  envVars:
  - key: NODE_VERSION
    value: '22'
  - key: NODE_ENV
    value: production
  - key: DATABASE_URL
    fromDatabase:
      name: opsdash-db
      property: connectionString
  - key: SESSION_SECRET
    generateValue: true
databases:
- name: opsdash-db
  plan: basic-256mb
  databaseName: opsdash
  user: opsdash
