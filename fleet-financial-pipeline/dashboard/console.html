<title>Zone Group Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --ground:#eef0f2; --surface:#ffffff; --surface-2:#f5f7f8; --surface-3:#e7ebee;
  --ink:#14181c; --body:#39424a; --muted:#5b6670; --faint:#8a949c;
  --rule:#d3d9de; --rule-soft:#e4e9ec;
  --accent:#1a5c7a; --accent-soft:#dbe8ee;
  --ok:#2c6e49; --warn:#9a6114; --critical:#a33327;
  --ok-bg:#e2efe7; --warn-bg:#f6ecd9; --critical-bg:#f6e3e0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f1316; --surface:#161c21; --surface-2:#1b2229; --surface-3:#232c34;
  --ink:#e6ebef; --body:#bcc6ce; --muted:#8896a1; --faint:#67757f;
  --rule:#2b353d; --rule-soft:#222a31;
  --accent:#5fb4d8; --accent-soft:#16303d;
  --ok:#6cc296; --warn:#d5a44f; --critical:#e08479;
  --ok-bg:#152a20; --warn-bg:#2c2413; --critical-bg:#2e1d1a;
}}
:root[data-theme="dark"]{
  --ground:#0f1316; --surface:#161c21; --surface-2:#1b2229; --surface-3:#232c34;
  --ink:#e6ebef; --body:#bcc6ce; --muted:#8896a1; --faint:#67757f;
  --rule:#2b353d; --rule-soft:#222a31;
  --accent:#5fb4d8; --accent-soft:#16303d;
  --ok:#6cc296; --warn:#d5a44f; --critical:#e08479;
  --ok-bg:#152a20; --warn-bg:#2c2413; --critical-bg:#2e1d1a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);
  font-family:'Source Sans 3',system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,.ui{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);margin:0;text-wrap:balance}
.mono,.n{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* shell */
.shell{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
@media(max-width:840px){.shell{grid-template-columns:1fr}.rail{position:static!important;height:auto!important}}

/* left rail */
.rail{background:var(--surface);border-right:1px solid var(--rule);position:sticky;top:0;
  height:100vh;overflow-y:auto;padding:18px 0 28px}
.brand{padding:0 18px 16px;border-bottom:1px solid var(--rule-soft);margin-bottom:14px}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--faint);font-family:'IBM Plex Mono',monospace}
.navgroup{padding:0 12px;margin-bottom:16px}
.navlabel{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);padding:0 6px 7px;font-weight:600}
.navbtn{display:flex;width:100%;align-items:baseline;gap:8px;padding:7px 10px;border-radius:4px;
  text-align:left;font-size:14px;color:var(--body);font-family:'Archivo',sans-serif}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .tag{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint)}
.navbtn[aria-current="true"] .tag{color:var(--accent)}

/* main */
main{padding:26px 30px 70px;max-width:1180px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.head h2{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.head .sub{color:var(--muted);font-size:14px;margin-left:auto;font-family:'IBM Plex Mono',monospace}
.lede{margin:0 0 22px;max-width:72ch;color:var(--body)}

/* kpi strip */
.kpis{display:flex;flex-wrap:wrap;gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-bottom:26px}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;
  flex:1 1 158px}
.kpi .k{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;
  letter-spacing:.03em}
.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi .d.up{color:var(--critical)}.kpi .d.down{color:var(--ok)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--rule);margin-bottom:22px}
.panel > h3{font-size:14px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--rule-soft);
  display:flex;align-items:center;gap:10px}
.panel > h3 .note{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400;
  font-family:'IBM Plex Mono',monospace}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* table */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:440px}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;
  border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
td.n,th.n{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
  white-space:nowrap;color:var(--ink)}
tbody tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.tot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--rule)}

/* severity chips */
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;
  font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--critical-bg);color:var(--critical)}
.chip.flat{background:var(--surface-3);color:var(--muted)}

/* severity stripe on alert rows */
.alert{display:grid;grid-template-columns:3px 1fr auto;gap:0 14px;align-items:center;
  border-bottom:1px solid var(--rule-soft)}
.alert:last-child{border-bottom:none}
.alert .stripe{align-self:stretch;background:var(--muted)}
.alert.crit .stripe{background:var(--critical)}
.alert.warn .stripe{background:var(--warn)}
.alert.ok .stripe{background:var(--ok)}
.alert .body{padding:12px 0}
.alert .t{font-family:'Archivo',sans-serif;font-weight:600;color:var(--ink);font-size:14.5px}
.alert .s{font-size:13px;color:var(--muted);margin-top:2px}
.alert .amt{padding-right:16px;font-family:'IBM Plex Mono',monospace;font-weight:600;
  color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;font-size:15px}

/* charts */
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
  padding:0 16px 14px;font-family:'IBM Plex Mono',monospace}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:baseline}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,17,.42);opacity:0;pointer-events:none;
  transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(430px,92vw);background:var(--surface);
  border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .2s ease;
  z-index:41;overflow-y:auto;box-shadow:-8px 0 26px rgba(10,14,17,.10)}
.drawer.on{transform:none}
.drawer header{padding:18px 20px 14px;border-bottom:1px solid var(--rule);
  display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surface)}
.drawer header h3{font-size:17px;font-weight:700;line-height:1.2}
.drawer header .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.drawer .x{margin-left:auto;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
.drawer .x:hover{color:var(--ink)}
.dsec{padding:16px 20px;border-bottom:1px solid var(--rule-soft)}
.dsec:last-child{border-bottom:none}
.dl{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:14px}
.dl dt{color:var(--muted);margin:0}
.dl dd{margin:0;font-family:'IBM Plex Mono',monospace;color:var(--ink);
  font-variant-numeric:tabular-nums;text-align:right}
.dsec p{margin:0;font-size:13.5px;color:var(--muted)}
.dsec p + p{margin-top:9px}
.src{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);
  text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px}
@media(prefers-reduced-motion:reduce){.scrim,.drawer{transition:none}}

/* theme toggle */
.themebar{display:flex;gap:5px;padding:12px 12px 4px}
.themebtn{flex:1;padding:6px 0;border-radius:5px;font-size:11.5px;font-family:'IBM Plex Mono',monospace;
  color:var(--muted);background:var(--surface-2);text-align:center;transition:background .1s,color .1s}
.themebtn:hover{color:var(--ink)}
.themebtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* truck search */
.searchwrap{padding:8px 12px 14px;position:relative}
.searchbox{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;
  background:var(--surface-2);color:var(--ink);font-size:13px;font-family:'Source Sans 3',sans-serif}
.searchbox::placeholder{color:var(--faint)}
.searchbox:focus{outline:2px solid var(--accent);outline-offset:1px}
.searchresults{position:absolute;left:12px;right:12px;top:100%;margin-top:2px;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 24px rgba(10,14,17,.16);
  max-height:300px;overflow-y:auto;z-index:50}
.searchresults button{display:block;width:100%;text-align:left;padding:8px 10px;font-size:13px;color:var(--body);
  border-bottom:1px solid var(--rule-soft)}
.searchresults button:last-child{border-bottom:none}
.searchresults button:hover{background:var(--surface-2)}
.searchresults .u{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink)}
.searchresults .d{font-size:11.5px;color:var(--muted);margin-top:1px}
.searchresults .empty{padding:10px;font-size:12.5px;color:var(--faint)}

/* sortable columns */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable .arrow{margin-left:4px;opacity:.45;font-size:9px}
th.sortable[data-dir]{color:var(--accent)}
th.sortable[data-dir] .arrow{opacity:1}

/* view transition */
#main{animation:fadein .16s ease}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#main{animation:none}}
</style>

/* ---------- tiny SVG chart helpers, one scale for marks and labels ---------- */
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v)));
  const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function barChart(labels, series, opts={}){
  const W=760, H=opts.h||220, L=64, R=14, T=14, B=labels.length>16?42:28;
  const max = niceMax(Math.max(...series.flatMap(s=>s.v)));
  const iw=W-L-R, ih=H-T-B, n=labels.length, step=iw/n;
  const bw = Math.max(2,(step-4)/series.length);
  let g='';
  for(let i=0;i<=4;i++){ const y=T+ih-ih*i/4;
    g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${css('--rule-soft')}" stroke-width="1"/>`+
       `<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="${css('--muted')}" font-family="IBM Plex Mono,monospace">${opts.fmt?opts.fmt(max*i/4):num(max*i/4)}</text>`; }
  series.forEach((s,si)=>{ s.v.forEach((v,i)=>{ const h=Math.max(0,ih*v/max);
    g+=`<rect x="${L+step*i+2+bw*si}" y="${T+ih-h}" width="${bw}" height="${h}" fill="${s.c}"><title>${labels[i]}: ${opts.fmt?opts.fmt(v):num(v)}</title></rect>`; }); });
  const every = Math.ceil(n/13);
  labels.forEach((lb,i)=>{ if(i%every) return;
    g+=`<text x="${L+step*i+step/2}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="${css('--muted')}" font-family="IBM Plex Mono,monospace">${lb}</text>`; });
  g+=`<line x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}" stroke="${css('--rule')}" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.alt||''}">${g}</svg>`;
}

function lineChart(labels, series, opts={}){
  const W=760, H=opts.h||210, L=64, R=14, T=14, B=30;
  const max=niceMax(Math.max(...series.flatMap(s=>s.v))), min=0;
  const iw=W-L-R, ih=H-T-B, n=labels.length;
  const X=i=> n<2?L+iw/2 : L+iw*i/(n-1), Y=v=> T+ih-ih*(v-min)/(max-min||1);
  let g='';
  for(let i=0;i<=4;i++){ const y=T+ih-ih*i/4;
    g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${css('--rule-soft')}"/>`+
       `<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="${css('--muted')}" font-family="IBM Plex Mono,monospace">${opts.fmt?opts.fmt(max*i/4):num(max*i/4)}</text>`; }
  series.forEach(s=>{
    const pts=s.v.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    if(opts.area) g+=`<polygon points="${L},${T+ih} ${pts} ${X(n-1)},${T+ih}" fill="${s.c}" opacity=".13"/>`;
    g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;
    const li=s.v.length-1;
    g+=`<circle cx="${X(li)}" cy="${Y(s.v[li])}" r="3.5" fill="${s.c}"/>`;
    s.v.forEach((v,i)=>{ g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="7" fill="transparent"><title>${labels[i]}: ${opts.fmt?opts.fmt(v):num(v)}</title></circle>`; });
  });
  const every=Math.ceil(n/12);
  labels.forEach((lb,i)=>{ if(i%every) return;
    g+=`<text x="${X(i)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="${css('--muted')}" font-family="IBM Plex Mono,monospace">${lb}</text>`; });
  g+=`<line x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}" stroke="${css('--rule')}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.alt||''}">${g}</svg>`;
}
const legend = items => `<div class="legend">${items.map(i=>`<span><i style="background:${i.c}"></i>${i.t}</span>`).join('')}</div>`;
const short = m => m.slice(2).replace('-','/');

}

  </div>

/* ---------- CEO overview cash: the weekly series aggregated up client-side ---------- */
const CASH_PERIODS = ['week','month','quarter','year'];
function cashBuckets(period){
  period = CASH_PERIODS.includes(period) ? period : 'month';
  const W = D.cash.weekly;
  if(period === 'week') return {labels: W.weeks.map(w=>periodLabelOf(w,'week')), revenue: W.revenue, spend: W.spend};
  const order = [], sums = {};
  W.weeks.forEach((w,i)=>{
    const key = periodKeyOf(w, period);
    if(!sums[key]){ sums[key] = {revenue:0, spend:0}; order.push(key); }
    sums[key].revenue += W.revenue[i];
    sums[key].spend += W.spend[i];
  });
  return {labels: order.map(k=>periodLabelOf(k, period)), revenue: order.map(k=>sums[k].revenue), spend: order.map(k=>sums[k].spend)};
}
function cashChartBody(period){
  period = CASH_PERIODS.includes(period) ? period : 'month';
  const b = cashBuckets(period);
  return `${legend([{c:css('--ok'),t:'revenue banked'},{c:css('--critical'),t:'real outflow'}])}
  <div class="pad" style="padding-top:0">${barChart(b.labels,
    [{v:b.revenue,c:css('--ok')},{v:b.spend,c:css('--critical')}],
    {fmt:v=>usd(v),alt:'Revenue and outflow by '+period})}</div>`;
}

/* ---------- P&L by period: aggregate the same weekly rows into month/quarter/year buckets ---------- */
const PNL_PERIODS = ['week','month','quarter','year'];
const PNL_SUM_FIELDS = ['gross','driver_pay','fuel','rent','toll','admin','other',
  'cd_gross','cd_result','cd_miles','oo_gross','oo_result','overhead','maintenance',
  'insurance','trailer','factoring','net','unallocated'];

function periodKeyOf(week, period){
  const [y, m] = week.split('-');
  if(period==='week') return week;
  if(period==='month') return `${y}-${m}`;
  if(period==='quarter') return `${y}-Q${Math.ceil(Number(m)/3)}`;
  return y;
}
function periodLabelOf(key, period){
  if(period==='month'){
    const [y, m] = key.split('-');
    return new Date(Number(y), Number(m)-1, 1).toLocaleString('en-US', {month:'short', year:'numeric'});
  }
  if(period==='quarter') return key.replace('-', ' ');
  return key; // week (ISO date) or year
}
function aggregatePeriod(weeks, period){
  const buckets = new Map();
  weeks.forEach(w=>{
    const key = periodKeyOf(w.week, period);
    if(!buckets.has(key)){
      const b = {period:key, weeks:[], flagWeeks:[], cd_trucks_sum:0, oo_trucks_sum:0, n:0};
      PNL_SUM_FIELDS.forEach(f=> b[f]=0);
      buckets.set(key, b);
    }
    const b = buckets.get(key);
    b.weeks.push(w.week); b.n++;
    b.cd_trucks_sum += w.cd_trucks; b.oo_trucks_sum += w.oo_trucks;
    PNL_SUM_FIELDS.forEach(f=> b[f] += w[f]);
    if(w.flags.length) b.flagWeeks.push(w.week);
  });
  return Array.from(buckets.values()).sort((a,b)=> a.period.localeCompare(b.period))
    .map(b=> Object.assign(b, {
      cd_trucks: Math.round(b.cd_trucks_sum / b.n), oo_trucks: Math.round(b.oo_trucks_sum / b.n),
    }));
}
function trucksForBucket(co, weeksInBucket){
  const tbw = D.weekly_pnl.companies[co].trucks_by_week;
  const map = new Map();
  weeksInBucket.forEach(wk=>{
    (tbw[wk] || []).forEach(t=>{
      let e = map.get(t.unit);
      if(!e){
        e = {unit:t.unit, driver:t.driver, kind:t.kind, iron_leased:t.iron_leased,
             gross:0, miles:0, driver_pay:0, fuel:0, rent:0, toll:0, admin:0, other:0, cost:0, result:0};
        map.set(t.unit, e);
      }
      e.driver = t.driver || e.driver; e.kind = t.kind; e.iron_leased = e.iron_leased || t.iron_leased;
      e.gross += t.gross; e.miles += t.miles; e.driver_pay += t.driver_pay; e.fuel += t.fuel;
      e.rent += t.rent; e.toll += t.toll; e.admin += t.admin; e.other += t.other;
      e.cost += t.cost; e.result += t.result;
    });
  });
  const rows = Array.from(map.values());
  rows.forEach(r=> r.rpm = r.miles ? r.gross / r.miles : null);
  rows.sort((a,b)=> a.result - b.result);
  return rows;
}

    <td class="n">${usd(x.amount)}/wk</td></tr>`;

    <div class="dsec"><p><strong>Most recent change, ${O.recent_changes[0]?.changed}:</strong> ${O.recent_changes.map(c=>

      </tbody></table></div>
      <div class="scroll"><table><thead><tr><th>Shop labour</th><th>Role</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>
        ${O.roster.shop_labour.map(rosterRow).join('')}

      </tbody></table></div>
    </div>
    <div class="dsec"><p>The "US staff &amp; office" line in the group table below also folds in office &amp; yard rent

    $${((be.shop_excluded.fixed_per_truck_week-be.before.fixed_per_truck_week)).toFixed(2)}/truck-week — real, but small. Ilfat's raise only shows up
    here if the shop's cost is deliberately folded into trucking (it isn't, by default); on its own it adds
    $${num(O.overhead.shop_per_week-O.overhead.shop_before_per_week)}/week to the
    shop's own labour cost, which feeds the shop's standalone P&amp;L, not the three operating companies'.</p></div>
    <div class="dsec"><p>This is a GROUP-level figure, not split by company — unlike the per-company break-even table above,
    which is a P&amp;L residual computed straight from the weekly sheets and does not read this roster at all. A raise
    here (Frank, Ilfat) moves this table; it will never move the per-company one above.</p></div>
  </div>`;
}

const PAYER={zone:'Zone (the company)',stl:'STL',driver:'Driver',dealer:'Dealer / warranty'};
const BD_PERIODS = ['month','quarter','year'];
const BD_QUARTER_OF = {January:'Q1',February:'Q1',March:'Q1',April:'Q2',May:'Q2',June:'Q2',
  July:'Q3',August:'Q3',September:'Q3',October:'Q4',November:'Q4',December:'Q4'};

function bdBuckets(period){
  const b = D.breakdowns;
  if(period==='year'){
    const yr = (D.pnl && D.pnl.year) || 'Total';
    return {labels:[yr], events:[b.events.reduce((a,c)=>a+c,0)], roadside:[b.roadside.reduce((a,c)=>a+c,0)]};
  }
  if(period==='quarter'){
    const order = [], sums = {};
    b.months.forEach((m,i)=>{
      const q = BD_QUARTER_OF[m] || '?';
      if(!sums[q]){ sums[q] = {events:0, roadside:0}; order.push(q); }
      sums[q].events += b.events[i]; sums[q].roadside += b.roadside[i];
    });
    return {labels:order, events:order.map(q=>sums[q].events), roadside:order.map(q=>sums[q].roadside)};
  }
  return {labels:b.months.map(m=>m.slice(0,3)), events:b.events, roadside:b.roadside};
}
function bdChartBody(period){
  period = BD_PERIODS.includes(period) ? period : 'month';
  const k = bdBuckets(period);
  return `${legend([{c:css('--accent'),t:'all events'},{c:css('--critical'),t:'road calls and tows'}])}
  <div class="pad" style="padding-top:0">${barChart(k.labels,
    [{v:k.events,c:css('--accent')},{v:k.roadside,c:css('--critical')}],{alt:'Breakdown events by period'})}</div>`;
}

/* ---------- theme ---------- */
function applyTheme(t){
  if(t==='auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  document.querySelectorAll('[data-theme-choice]').forEach(b=>
    b.setAttribute('aria-current', String(b.dataset.themeChoice===t)));
  try{ localStorage.setItem('zc-theme', t); }catch(e){}
}

  b.onclick = ()=> applyTheme(b.dataset.themeChoice));

  let saved = 'auto';
  try{ saved = localStorage.getItem('zc-theme') || 'auto'; }catch(e){}
  applyTheme(saved);
})();

/* ---------- sortable tables: click a header to sort its body rows ---------- */
function enableSort(table){
  if(!table || table.dataset.sortBound) return;
  table.dataset.sortBound = '1';
  const ths = Array.from(table.querySelectorAll('thead th'));
  ths.forEach((th,i)=>{
    th.classList.add('sortable');
    th.innerHTML += ' <span class="arrow">↕</span>';
    th.onclick = ()=>{
      const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
      ths.forEach(x=>{ delete x.dataset.dir; const a=x.querySelector('.arrow'); if(a) a.textContent='↕'; });
      th.dataset.dir = dir;
      const arrow = th.querySelector('.arrow'); if(arrow) arrow.textContent = dir==='asc' ? '▲' : '▼';
      const tbody = table.querySelector('tbody');
      const all = Array.from(tbody.children);
      const rows = all.filter(r=>!r.classList.contains('wk-detail') && !r.classList.contains('tot'));
      const tots = all.filter(r=>r.classList.contains('tot'));
      const detailOf = new Map();
      rows.forEach(r=>{ if(r.nextElementSibling && r.nextElementSibling.classList.contains('wk-detail'))
        detailOf.set(r, r.nextElementSibling); });
      const parse = tr=>{
        const cell = tr.children[i]; if(!cell) return '';
        let t = cell.textContent.replace(/[▲▼↕]/g,'').trim();
        const neg = /^-/.test(t);
        const n = t.replace(/[$,%]/g,'').replace(/^-/,'').trim();
        const v = parseFloat(n);
        return isNaN(v) ? t.toLowerCase() : (neg ? -v : v);
      };
      const numeric = rows.length > 0 && rows.every(r=> typeof parse(r) === 'number');
      rows.sort((a,b)=>{
        const va=parse(a), vb=parse(b);
        const cmp = numeric ? va-vb : String(va).localeCompare(String(vb));
        return dir==='asc' ? cmp : -cmp;
      });
      rows.forEach(r=>{ tbody.appendChild(r); const d=detailOf.get(r); if(d) tbody.appendChild(d); });
      tots.forEach(r=> tbody.appendChild(r));
    };
  });
}

/* ---------- find a truck across every week and every company ---------- */
const TRUCK_INDEX = (() => {
  const idx = {};
  if(!D.weekly_pnl) return idx;
  Object.keys(D.weekly_pnl.companies).forEach(co=>{
    const tbw = D.weekly_pnl.companies[co].trucks_by_week || {};
    Object.keys(tbw).forEach(week=>{
      tbw[week].forEach(t=>{
        const e = idx[t.unit] || (idx[t.unit] = {unit:t.unit, drivers:new Set(), companies:new Set(),
          weeks:0, gross:0, result:0, miles:0, kind:t.kind, rows:[]});
        if(t.driver) e.drivers.add(t.driver);
        e.companies.add(co); e.weeks++; e.gross += t.gross; e.result += t.result; e.miles += t.miles;
        e.kind = t.kind;
        e.rows.push(Object.assign({co, week}, t));
      });
    });
  });
  return idx;
})();

function openTruckDrawer(unit){
  const e = TRUCK_INDEX[unit]; if(!e) return;
  $('#searchresults').hidden = true; $('#trucksearch').value = '';
  const rows = e.rows.slice().sort((a,b)=> a.week.localeCompare(b.week));
  const driver = Array.from(e.drivers)[0] || '(driver unknown)';
  openDrawer('Truck ' + unit, driver, `
    <div class="dsec"><div class="src">${Array.from(e.companies).join(' / ')}</div><dl class="dl">
      <dt>Weeks on the books</dt><dd>${e.weeks}</dd>
      <dt>Total gross</dt><dd>${usd(e.gross)}</dd>
      <dt>Total result</dt><dd>${usd(e.result)}</dd>
      <dt>Total miles</dt><dd>${num(e.miles)}</dd>
      <dt>Kind, most recent</dt><dd>${e.kind==='owner_operator'?'Owner-operator':'Company driver'}</dd></dl></div>
    <div class="dsec"><div class="src">Result by week</div>
      ${lineChart(rows.map(r=>r.week.slice(5)), [{v:rows.map(r=>r.result),c:css('--ok')}],
        {fmt:v=>usd(v),area:true,h:160,alt:'Result by week for truck '+unit})}</div>
    <div class="dsec"><p>A company-driver week prices the company's own cost. On an owner-operator week the
    driver pay/fuel/rent/toll columns are the driver's own settlement deductions, recovered from them, not

}

(function initSearch(){
  const box = $('#trucksearch'), res = $('#searchresults');
  if(!box) return;
  function renderSearch(q){
    q = q.trim().toLowerCase();
    if(!q){ res.hidden = true; res.innerHTML = ''; return; }
    const hits = Object.values(TRUCK_INDEX).filter(e=>
      e.unit.toLowerCase().includes(q) || Array.from(e.drivers).some(d=>d.toLowerCase().includes(q))
    ).slice(0, 8);
    res.hidden = false;
    res.innerHTML = hits.length ? hits.map(e=>
      `<button data-truck="${e.unit}"><span class="u">${e.unit}</span> — ${Array.from(e.drivers)[0]||'—'}
        <div class="d">${Array.from(e.companies).join('/')} · ${e.weeks} weeks · ${usd(e.result)} total result</div></button>`
    ).join('') : `<div class="empty">No truck or driver matches "${q}"</div>`;
    res.querySelectorAll('[data-truck]').forEach(b=> b.onclick = ()=> openTruckDrawer(b.dataset.truck));
  }
  box.addEventListener('input', e=> renderSearch(e.target.value));
  box.addEventListener('focus', e=> { if(e.target.value) renderSearch(e.target.value); });
  box.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ const first = res.querySelector('[data-truck]'); if(first) first.click(); }
    if(e.key==='Escape'){ res.hidden = true; box.blur(); }
  });
  document.addEventListener('click', e=>{ if(!e.target.closest('.searchwrap')) res.hidden = true; });
})();

let current = null;
function go(v){ location.hash = v; }
window.addEventListener('hashchange', ()=> render(location.hash.slice(1) || 'overview'));
function render(v){
  const firstRender = current === null;
  current = v;
  $('#main').innerHTML = ENTS.includes(v) ? entityView(v) : (V[v]||V.overview)();
  document.querySelectorAll('.navbtn').forEach(b=>{ if(!b.dataset.cdco && !b.dataset.wkco && !b.dataset.wkperiod && !b.dataset.bdperiod && !b.dataset.wkdco && !b.dataset.wkweek && !b.dataset.cashperiod) b.setAttribute('aria-current', String(b.dataset.view===v)); });
  if(!firstRender) $('#main').scrollIntoView({block:'start'});
  wire();
  if(v==='costdebt'){
    const grid = $('#cdgrid'); if(grid) grid.innerHTML = costdebtGrid('ZONE');
  }
  if(v==='pnl'){
    const wk = $('#wkpnl'); if(wk){ wk.innerHTML = weeklyPnlPanel('ZONE','week'); wireWeeklyPnl('ZONE','week'); }
    const wkd = $('#wkweekpanel'); if(wkd){ wkd.innerHTML = weekDetailPanel('ZONE'); wireWeekDetail('ZONE'); }
  }
}
function currentWkCo(){ return (document.querySelector('[data-wkco][aria-current="true"]')||{}).dataset?.wkco || 'ZONE'; }
function currentWkPeriod(){ return (document.querySelector('[data-wkperiod][aria-current="true"]')||{}).dataset?.wkperiod || 'week'; }
function wire(){
  document.querySelectorAll('[data-goto]').forEach(b=> b.onclick = ()=>go(b.dataset.goto));
  document.querySelectorAll('[data-cdco]').forEach(b=> b.onclick = ()=>{
    document.querySelectorAll('[data-cdco]').forEach(x=>x.setAttribute('aria-current', String(x===b)));
    $('#cdgrid').innerHTML = costdebtGrid(b.dataset.cdco);
  });
  document.querySelectorAll('[data-wkco]').forEach(b=> b.onclick = ()=>{
    document.querySelectorAll('[data-wkco]').forEach(x=>x.setAttribute('aria-current', String(x===b)));
    const period = currentWkPeriod();
    $('#wkpnl').innerHTML = weeklyPnlPanel(b.dataset.wkco, period);
    wireWeeklyPnl(b.dataset.wkco, period);
  });
  document.querySelectorAll('[data-wkperiod]').forEach(b=> b.onclick = ()=>{
    document.querySelectorAll('[data-wkperiod]').forEach(x=>x.setAttribute('aria-current', String(x===b)));
    const co = currentWkCo();
    $('#wkpnl').innerHTML = weeklyPnlPanel(co, b.dataset.wkperiod);
    wireWeeklyPnl(co, b.dataset.wkperiod);
  });
  document.querySelectorAll('[data-bdperiod]').forEach(b=> b.onclick = ()=>{
    document.querySelectorAll('[data-bdperiod]').forEach(x=>x.setAttribute('aria-current', String(x===b)));
    $('#bdchart').innerHTML = bdChartBody(b.dataset.bdperiod);
  });
  document.querySelectorAll('[data-cashperiod]').forEach(b=> b.onclick = ()=>{
    document.querySelectorAll('[data-cashperiod]').forEach(x=>x.setAttribute('aria-current', String(x===b)));
    $('#cashchart').innerHTML = cashChartBody(b.dataset.cashperiod);
  });
  document.querySelectorAll('[data-wkdco]').forEach(b=> b.onclick = ()=>{
    document.querySelectorAll('[data-wkdco]').forEach(x=>x.setAttribute('aria-current', String(x===b)));
    $('#wkweekpanel').innerHTML = weekDetailPanel(b.dataset.wkdco);
    wireWeekDetail(b.dataset.wkdco);
  });
  document.querySelectorAll('tr.click[data-cat]').forEach(tr=> tr.onclick = ()=>{
    const c = D.cash.outflow_by_category.find(x=>x.category===tr.dataset.cat);
    const tot = D.cash.outflow_by_category.filter(x=>x.spend).reduce((a,x)=>a+x.amount,0);
    openDrawer('Cash category', c.category.replace(/_/g,' '), `
      <div class="dsec"><div class="src">Verified bank &amp; card</div><dl class="dl">
        <dt>Total out</dt><dd>${usd(-c.amount)}</dd>
        <dt>Share of real outflow</dt><dd>${pct(c.amount/tot*100)}</dd>
        <dt>Transactions</dt><dd>${num(c.txns)}</dd>
        <dt>Average</dt><dd>${usd(-c.amount/c.txns,2)}</dd></dl></div>
      <div class="dsec"><p>Every transaction in this category sits on a statement that reconciles to its
      own beginning and ending balance. ${NOTE[c.category]||''}</p></div>`);
  });
  document.querySelectorAll('tr.click[data-line]').forEach(tr=> tr.onclick = ()=>{
    const e = tr.dataset.ent, k = tr.dataset.line, E = D.entities[e], s = E.series;
    const v = s[k].reduce((a,b)=>a+b,0), gross = s.gross.reduce((a,b)=>a+b,0);
    const miles = s.mileage.reduce((a,b)=>a+b,0);
    const lb = (COST.find(c=>c[0]===k)||[,k])[1];
    const peak = s[k].indexOf(Math.max(...s[k]));
    openDrawer(LABEL[e]||e, lb.replace('&amp;','&'), `
      <div class="dsec"><div class="src">Weekly P&amp;L workbook</div><dl class="dl">
        <dt>Total</dt><dd>${usd(v)}</dd>
        <dt>Share of gross</dt><dd>${pct(v/gross*100)}</dd>
        <dt>Per mile</dt><dd>${miles?usd(v/miles,3):'—'}</dd>
        <dt>Per unit-week</dt><dd>${usd(v/E.unit_weeks,2)}</dd>
        <dt>Highest month</dt><dd>${E.months[peak]} · ${usd(s[k][peak])}</dd></dl></div>
      <div class="dsec"><div class="src">By month</div>
        ${barChart(E.months.map(short),[{v:s[k],c:css('--accent')}],{fmt:x=>usd(x),h:170,alt:lb+' by month'})}</div>
      <div class="dsec"><p>This is what the workbook asserts, not what left the bank. Driver pay here is
      the <em>gross settlement</em>; the bank shows the net after deductions.</p></div>`);
  });
}
const NOTE = {
  fuel:'Two rails: EFS/WEX through March 2026, Relay after. The itemization confirms 99.5% is diesel and DEF.',
  lease_rent:'Truck and trailer rental. Purchases of trucks are counted separately as capital, not rent.',
  insurance_premium:'Largely financed rather than paid direct — $1.44M of it goes to a premium finance company as level instalments, so the bank shows loan payments, not premiums.',
  uncategorized:'Every dollar has a named counterparty; what is missing is what they are for. Around forty names would clear most of it.',
  related_party_review:'Wired internationally to a name outside the declared entity list. Held out of intercompany on purpose so it stays visible.',
  capex_truck_trailer:'Truck purchases, mostly by Iron Lease from Fleet Advantage and EquipLinc.',
  driver_settlement:'What actually left the bank for drivers. The P&L records the gross settlement; the gap between them is the deduction pool.',
  maintenance:'Understated here — most repair spend rides the fuel card or Truck Max rather than appearing as a maintenance payment.',
  tolls:'Bestpass settles as a lump; the itemization behind it is 103,112 crossings.',
};
$('#navents').innerHTML = ENTS.map(e=>`<button class="navbtn" data-view="${e}">${LABEL[e]||e}<span class="tag">${(D.entities[e].unit_weeks/1000).toFixed(1)}k</span></button>`).join('');
document.querySelectorAll('.navbtn').forEach(b=>{ if(!b.dataset.cdco && !b.dataset.wkco) b.onclick = ()=>go(b.dataset.view); });
render(location.hash.slice(1) || 'overview');
</script>
